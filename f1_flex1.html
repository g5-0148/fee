<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Prachi">
    <title>Flex Box</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courgette&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            font-family: "Courgette", cursive;
            font-size: 16px;
            background-color: #f4f4f4;
            color: #333;
        }
        section{
            padding: 10px;
            text-align: center;
        }
        .box{
            background-color: rgb(9, 81, 51);
            color: white;
        }
        .main{
            background-color: white;
            color: #333;
        }
    </style>
</head>
<body>
    <section class="box" style="height: 10vh">G5 Sem 3</section>
    <section class="main" style="height:80vh;">
        <h2>Welcome to Flex Box Layout</h2>
        <p>This is the main content area.</p>
    </section>
    <section class="box" style="height: 10vh; width: 100%;">
        Prachi 2510990148
    </section>
</body>
</html>
