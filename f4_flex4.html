<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Prachi">
    <title>Flex Box</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
            color: white;
        }

        section{
            padding: 10px;
        }

        .box{
            background-color: #2babab;
        }

        .fc{
            display: flex;
            gap: 20px;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        .item{
            height: 150px;
            width: 180px;
            background-color: #de9887;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <section class="box" style="height: 10vh">
        G5 Sem 3
    </section>

    <section class="fc" style="height: 80vh; background-color: #fff8f0;">
        <main class="item">
            Main-1
        </main>

        <main class="item">
            Main-2
        </main>

        <main class="item">
            Main-3
        </main>
    </section>

    <section class="box" style="height: 10vh; width: 100%;">
        Prachi 2510990148
    </section>

</body>
</html>
